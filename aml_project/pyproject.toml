[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "aml_prediction"
version = "0.0.1"
description = "SalyPrediction Model"
authors = [
  { name = "Team 6" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = ">=3.10"


[tool.ruff]
line-length = 99
src = ["aml_prediction"]
include = ["pyproject.toml", "aml_prediction/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["aml_prediction"]
force-sort-within-sections = true

